<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inda AI</title>
<link id="appFavicon" rel="icon" href="">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,Arial;background:#09090b;color:#f7f7f8}button,input,textarea{font:inherit}
button{cursor:pointer}.hidden{display:none!important}
#auth{height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#1d1d25,transparent 38%)}
.card{width:min(430px,100%);background:#131317;border:1px solid #303039;border-radius:22px;padding:26px;box-shadow:0 30px 100px #0008}
.logo{font-size:30px;font-weight:900;text-align:center}
.app-logo{width:64px;height:64px;border-radius:18px;object-fit:cover;border:1px solid #34343c;background:#202026;display:block;margin:0 auto 12px}
.brand-row{display:flex;align-items:center;gap:9px;padding:8px}
.brand-logo{width:34px;height:34px;border-radius:10px;object-fit:cover;border:1px solid #34343c;background:#202026}
.icon-change{width:100%;height:34px;margin-top:6px;border:1px solid #303037!important;background:#151519!important;color:#888!important;font-size:11px}
.welcome-logo-img{width:72px;height:72px;border-radius:20px;object-fit:cover;border:1px solid #34343c;background:#202026;margin:0 auto 15px}
.sub{text-align:center;color:#888;margin:7px 0 20px;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;height:42px;border:1px solid #33333b;border-radius:10px;background:#1b1b20;color:#aaa}
.tabs .active{background:white;color:#111}
.form{display:none}
.form.active{display:block}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:#aaa;margin-bottom:6px}
.field input{width:100%;height:45px;border:1px solid #33333b;border-radius:10px;background:#0d0d10;color:white;padding:0 11px}
.showpass{display:flex!important;align-items:center;gap:7px;margin-top:8px!important}
.showpass input{width:14px;height:14px}
.primary{width:100%;height:45px;border:0;border-radius:10px;background:white;color:#111;font-weight:800}
#authMsg{min-height:20px;text-align:center;color:#999;font-size:12px;margin-top:10px}

#app{display:none;height:100%}
.layout{height:100%;display:flex}
.side{width:280px;background:#101013;border-right:1px solid #292930;padding:13px;display:flex;flex-direction:column}
.brand{font-weight:900;font-size:20px;padding:12px 8px}
.brand small{font-size:9px;color:#888;border:1px solid #33333b;border-radius:999px;padding:3px 6px;margin-left:5px}
.side button{border:1px solid #33333b;background:#1b1b20;color:#ddd;border-radius:10px}
.new{height:43px}
.project-new{height:36px;margin-top:7px;color:#aaa!important}
.label{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.13em;margin:17px 8px 8px}

#projects,#history{overflow:auto}
.project{display:flex;gap:7px;align-items:center;padding:8px;border-radius:8px;color:#999;font-size:12px;cursor:pointer}
.project:hover,.project.active{background:#26262d;color:white}
.project span:first-child{flex:1}
.project .x{border:0;background:transparent;color:#777}

#history{flex:1}
.chatitem{padding:9px;border-radius:8px;color:#999;font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatitem:hover,.chatitem.active{background:#24242a;color:white}

.plan{border:1px solid #292930;border-radius:12px;padding:10px;background:#16161a;margin-top:10px;font-size:11px;color:#777}
.plan b{display:block;color:white;font-size:13px;margin-bottom:3px}

.foot{border-top:1px solid #222228;padding-top:10px;margin-top:10px}
.user{font-size:12px;color:#aaa;margin-bottom:7px}
.logout{width:100%;height:36px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.head{height:58px;border-bottom:1px solid #292930;display:flex;align-items:center;justify-content:center;position:relative}
.head b{font-size:14px}
.head small{display:block;text-align:center;color:#666}
.status{position:absolute;right:14px;font-size:10px;color:#777}

#chat{flex:1;overflow:auto;padding:25px 20px 160px}
.inner{max-width:920px;margin:auto}
.welcome{min-height:60vh;display:grid;place-items:center;text-align:center;color:#777}
.welcome h1{color:white;margin-bottom:7px}

.row{display:flex;margin:16px 0}
.row.me{justify-content:flex-end}
.stack{max-width:min(84%,800px)}
.msg{white-space:pre-wrap;line-height:1.55;font-size:14px}
.msg.me{background:#29292f;padding:11px 14px;border-radius:15px}

.avatar{width:29px;height:29px;border:1px solid #33333b;background:#222228;border-radius:9px;display:grid;place-items:center;font-size:9px;font-weight:900;margin-right:10px}

.attachgrid{display:grid;grid-template-columns:repeat(2,minmax(0,180px));gap:6px;margin-bottom:7px}
.attachgrid img{width:100%;max-height:220px;object-fit:cover;border-radius:11px;border:1px solid #33333b}

.actions{display:flex;gap:5px;margin-top:7px}
.actions button{border:1px solid #303037;background:#16161a;color:#888;border-radius:7px;font-size:10px;padding:5px 7px}

.inputarea{position:absolute;left:0;right:0;bottom:0;padding:22px 16px 14px;background:linear-gradient(transparent,#09090b 25%)}

#preview{max-width:920px;margin:0 auto 7px;display:flex;gap:6px;flex-wrap:wrap}

.prev{width:68px;height:68px;border-radius:10px;overflow:hidden;position:relative;border:1px solid #3a3a42}
.prev img{width:100%;height:100%;object-fit:cover}
.prev button{position:absolute;right:3px;top:3px;width:20px;height:20px;border:0;border-radius:50%;background:#000c;color:white}

.box{max-width:920px;margin:auto;display:flex;align-items:flex-end;gap:6px;background:#1b1b20;border:1px solid #34343c;border-radius:17px;padding:7px}
.box textarea{flex:1;resize:none;min-height:40px;max-height:180px;border:0;outline:0;background:transparent;color:white;padding:9px;font-size:14px}

.icon{width:38px;height:38px;border:1px solid #3a3a42;border-radius:10px;background:#27272d;color:#ddd}
.send{width:38px;height:38px;border:0;border-radius:10px;background:white;color:#111;font-size:18px}
.mic.on{background:white;color:#111}
.hint{text-align:center;font-size:9px;color:#555;margin-top:6px}

.imageout{max-width:750px;width:100%;border-radius:16px;border:1px solid #33333b;margin-top:8px}

.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px;z-index:50}
.modal.open{display:grid}
.modal .card{width:min(460px,100%)}
.modal input{width:100%;height:44px;border:1px solid #33333b;border-radius:10px;background:#0d0d10;color:white;padding:0 11px;margin:10px 0}

@media(max-width:760px){
.side{display:none}
.head{justify-content:flex-start;padding-left:14px}
.status{display:none}
#chat{padding:15px 10px 145px}
.inputarea{padding:10px}
.stack{max-width:calc(100vw - 60px)}
}
</style>
</head>

<body>

<div id="auth">

  <div class="card">

    <img id="authLogo" class="app-logo" alt="Inda AI">

    <div class="logo">Inda AI</div>

    <div class="sub">
      Chat + fotos + proyectos + dictado
    </div>

    <div class="tabs">

      <button
        id="loginTab"
        class="active"
        onclick="tab('login')"
      >
        Iniciar sesión
      </button>

      <button
        id="registerTab"
        onclick="tab('register')"
      >
        Crear cuenta
      </button>

    </div>

    <form
      id="loginForm"
      class="form active"
      onsubmit="login(event)"
    >

      <div class="field">

        <label>
          Usuario
        </label>

        <input
          id="loginUser"
          required
        >

      </div>

      <div class="field">

        <label>
          Contraseña
        </label>

        <input
          id="loginPass"
          type="password"
          required
        >

        <label class="showpass">

          <input
            type="checkbox"
            onchange="showPass('loginPass',this)"
          >

          Mostrar contraseña

        </label>

      </div>

      <button class="primary">
        Entrar
      </button>

    </form>

    <form
      id="registerForm"
      class="form"
      onsubmit="register(event)"
    >

      <div class="field">

        <label>
          Usuario
        </label>

        <input
          id="regUser"
          minlength="3"
          maxlength="30"
          required
        >

      </div>

      <div class="field">

        <label>
          Contraseña
        </label>

        <input
          id="regPass"
          type="password"
          minlength="6"
          required
        >

        <label class="showpass">

          <input
            type="checkbox"
            onchange="showPass('regPass',this)"
          >

          Mostrar contraseña

        </label>

      </div>

      <button class="primary">
        Crear cuenta
      </button>

    </form>

    <div id="authMsg"></div>

  </div>

</div>


<div id="app">

  <div class="layout">

    <aside class="side">

      <div class="brand">
        Inda AI
        <small>ULTRA</small>
      </div>

      <button
        class="new"
        onclick="newChat()"
      >
        + Nuevo chat
      </button>

      <button
        class="project-new"
        onclick="openProject()"
      >
        ＋ Crear proyecto
      </button>

      <div class="label">
        Proyectos
      </div>

      <div id="projects"></div>

      <div class="plan">

        <b id="planName">
          Normal
        </b>

        <span id="planInfo">
          50 preguntas
        </span>

        <div id="roleInfo"></div>

      </div>

      <div class="label">
        Conversaciones
      </div>

      <div id="history"></div>

      <div class="foot">

        <div
          id="currentUser"
          class="user"
        ></div>

        <button
          class="logout"
          onclick="logout()"
        >
          Cerrar sesión
        </button>

      </div>

    </aside>


    <main class="main">

      <div class="head">

        <div>

          <b>
            Inda AI
          </b>

          <small
            id="projectLabel"
          ></small>

        </div>

        <div
          id="status"
          class="status"
        >
          Comprobando...
        </div>

      </div>


      <section id="chat">

        <div
          id="inner"
          class="inner"
        ></div>

      </section>


      <div class="inputarea">

        <div id="preview"></div>

        <div class="box">

          <input
            id="fileInput"
            class="hidden"
            type="file"
            accept="image/*"
            multiple
            onchange="pickFiles(event)"
          >

          <button
            class="icon"
            onclick="fileInput.click()"
            title="Adjuntar foto"
          >
            ＋
          </button>

          <textarea
            id="prompt"
            rows="1"
            placeholder="Escribí, pegá una foto o usá el micrófono..."
          ></textarea>

          <button
            id="mic"
            class="icon mic"
            onclick="toggleMic()"
            title="Hablar"
          >
            🎙
          </button>

          <button
            class="icon"
            onclick="makeImage()"
            title="Generar imagen"
          >
            🖼
          </button>

          <button
            id="stopBtn"
            class="icon hidden"
            onclick="stopGeneration()"
            title="Detener"
          >
            ■
          </button>

          <button
            id="sendBtn"
            class="send"
            onclick="send()"
          >
            ↑
          </button>

        </div>

        <div class="hint">
          Ctrl+V pega fotos · micrófono = texto · respuesta continua automática
        </div>

      </div>

    </main>

  </div>

</div>


<div
  id="projectModal"
  class="modal"
  onclick="if(event.target===this)closeProject()"
>

  <div class="card">

    <h2>
      Nuevo proyecto
    </h2>

    <input
      id="projectInput"
      maxlength="60"
      placeholder="Nombre del proyecto"
    >

    <button
      class="primary"
      onclick="createProject()"
    >
      Crear proyecto
    </button>

  </div>

</div>


<script>

const API =
"https://inda-ai-api2-0.belisarionogueira2013.workers.dev";


const USERS =
"inda_users_v12";

const SESSION =
"inda_session_v12";

const CEO =
"beligmail";


const CEO_HASH =
"84fc6cebf7edf2cc21f9ea8c3b5a568ebeeaf2aa5d9850d7a2b185f5d0922efa";


const LIMIT =
50;


let me =
null;

let chats =
[];

let chatId =
null;

let projects =
[];

let projectId =
"all";

let pending =
[];

let recognition =
null;

let listening =
false;

let generating =
false;

let stopRequested =
false;

let activeController =
null;


const ICON_KEY =
"inda_app_icon_v1";


const DEFAULT_ICON =
"data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(
`
<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 256 256"
>

<rect
width="256"
height="256"
rx="58"
fill="#17171c"
/>

<rect
x="18"
y="18"
width="220"
height="220"
rx="48"
fill="#222229"
stroke="#3a3a45"
stroke-width="4"
/>

<text
x="128"
y="150"
text-anchor="middle"
font-family="Arial"
font-size="78"
font-weight="900"
fill="white"
>
IA
</text>

</svg>
`
);


const $ =
id =>
document.getElementById(id);


const uid =
() =>
Date.now().toString(36) +
Math.random().toString(36).slice(2,8);


const norm =
s =>
String(s || "")
.toLowerCase()
.normalize("NFD")
.replace(
/[\u0300-\u036f]/g,
""
);


async function hash(s){

const b =
await crypto.subtle.digest(
"SHA-256",
new TextEncoder().encode(s)
);

return [
...new Uint8Array(b)
]
.map(
x =>
x.toString(16).padStart(2,"0")
)
.join("");

}


function users(){

try{

return JSON.parse(
localStorage.getItem(USERS) ||
"{}"
);

}catch{

return {};

}

}


function saveUsers(x){

localStorage.setItem(
USERS,
JSON.stringify(x)
);

}


function showPass(id,c){

$(id).type =
c.checked
? "text"
: "password";

}


function tab(x){

$("loginForm")
.classList
.toggle(
"active",
x === "login"
);

$("registerForm")
.classList
.toggle(
"active",
x === "register"
);

$("loginTab")
.classList
.toggle(
"active",
x === "login"
);

$("registerTab")
.classList
.toggle(
"active",
x === "register"
);

$("authMsg").textContent =
"";

}


function getAppIcon(){

return (
localStorage.getItem(
ICON_KEY
) ||
DEFAULT_ICON
);

}


function applyAppIcon(){

const src =
getAppIcon();

if(
$("authLogo")
)
$("authLogo").src =
src;

if(
$("appFavicon")
)
$("appFavicon").href =
src;

document
.querySelectorAll(
".welcome-logo-img"
)
.forEach(
x =>
x.src = src
);

}


async function changeAppIcon(e){

const f =
e.target.files?.[0];

e.target.value =
"";

if(
!f ||
!String(f.type)
.startsWith("image/")
)
return;


const raw =
await new Promise(
(res,rej)=>{

const r =
new FileReader();

r.onload =
()=>res(r.result);

r.onerror =
rej;

r.readAsDataURL(f);

}
);


const out =
await new Promise(
res=>{

const im =
new Image();

im.onload =
()=>{

const size =
256;

const c =
document.createElement(
"canvas"
);

const ctx =
c.getContext("2d");

c.width =
size;

c.height =
size;

const scale =
Math.max(
size/im.width,
size/im.height
);

const w =
im.width *
scale;

const h =
im.height *
scale;

ctx.drawImage(
im,
(size-w)/2,
(size-h)/2,
w,
h
);

res(
c.toDataURL(
"image/jpeg",
.9
)
);

};

im.onerror =
()=>res(raw);

im.src =
raw;

}
);


localStorage.setItem(
ICON_KEY,
out
);

applyAppIcon();

}


function setGenerating(v){

generating =
v;

$("sendBtn")
?.classList
.toggle(
"hidden",
v
);

$("stopBtn")
?.classList
.toggle(
"hidden",
!v
);

}


function stopGeneration(){

stopRequested =
true;

try{

activeController
?.abort();

}catch{}

setGenerating(
false
);

}


async function register(e){

e.preventDefault();


const username =
$("regUser")
.value
.trim();


const password =
$("regPass")
.value;


const key =
username
.toLowerCase();


const u =
users();


if(
key === CEO
){

$("authMsg")
.textContent =
"Ese usuario está reservado.";

return;

}


if(
u[key]
){

$("authMsg")
.textContent =
"Ese usuario ya existe.";

return;

}


u[key] = {

username,

passwordHash:
await hash(password),

premium:false,

role:"Usuario"

};


saveUsers(u);


tab(
"login"
);


$("loginUser")
.value =
username;


$("authMsg")
.textContent =
"Cuenta creada. Ya podés entrar.";

}


async function login(e){

e.preventDefault();


const username =
$("loginUser")
.value
.trim();


const password =
$("loginPass")
.value;


const key =
username
.toLowerCase();


const h =
await hash(password);


if(
key === CEO
){

if(
h !== CEO_HASH
){

$("authMsg")
.textContent =
"Usuario o contraseña incorrectos.";

return;

}


me = {

username:CEO,

premium:true,

role:"CEO"

};


localStorage.setItem(
SESSION,
JSON.stringify(me)
);


start();

return;

}


const u =
users()[key];


if(
!u ||
u.passwordHash !== h
){

$("authMsg")
.textContent =
"Usuario o contraseña incorrectos.";

return;

}


me = {

username:
u.username,

premium:
!!u.premium,

role:
u.role ||
"Usuario"

};


localStorage.setItem(
SESSION,
JSON.stringify(me)
);


start();

}


function logout(){

localStorage
.removeItem(
SESSION
);

location.reload();

}


function restore(){

try{

me =
JSON.parse(
localStorage.getItem(
SESSION
) ||
"null"
);


if(
me?.username
)
start();

}catch{}

}


function chatKey(){

return (
"inda_chats_v12_" +
me.username
.toLowerCase()
);

}


function projectKey(){

return (
"inda_projects_v12_" +
me.username
.toLowerCase()
);

}


function usageKey(){

return (
"inda_usage_" +
me.username
.toLowerCase() +
"_" +
new Date()
.toISOString()
.slice(0,10)
);

}


function usage(){

return Number(
localStorage.getItem(
usageKey()
) ||
0
);

}


function inc(){

localStorage.setItem(
usageKey(),
String(
usage()+1
)
);

renderPlan();

}


function saveChats(){

localStorage.setItem(
chatKey(),
JSON.stringify(chats)
);

}


function saveProjects(){

localStorage.setItem(
projectKey(),
JSON.stringify(projects)
);

}


function load(){

try{

chats =
JSON.parse(
localStorage.getItem(
chatKey()
) ||
"[]"
);

}catch{

chats =
[];

}


try{

projects =
JSON.parse(
localStorage.getItem(
projectKey()
) ||
"[]"
);

}catch{

projects =
[];

}


if(
!chats.length
){

newChat();

}else{

chatId =
chats[0].id;

renderChat();

}


renderAll();

}


function start(){

applyAppIcon();

$("auth")
.style
.display =
"none";

$("app")
.style
.display =
"block";

$("currentUser")
.textContent =
me.username;

load();

renderPlan();

health();

}


function renderPlan(){

$("planName")
.textContent =
me.premium
? "Premium"
: "Normal";


$("planInfo")
.textContent =
me.premium
? "Preguntas ilimitadas"
: Math.max(
0,
LIMIT - usage()
) +
" preguntas disponibles";


$("roleInfo")
.textContent =
me.role ||
"Usuario";

}


function health(){

fetch(
API + "/health"
)
.then(
r=>{

if(
!r.ok
)
throw 0;

$("status")
.textContent =
"Inda AI conectada";

}
)
.catch(
()=>{

$("status")
.textContent =
"Servidor desconectado";

}
);

}


function openProject(){

$("projectInput")
.value =
"";

$("projectModal")
.classList
.add(
"open"
);

setTimeout(
()=>
$("projectInput")
.focus(),
20
);

}


function closeProject(){

$("projectModal")
.classList
.remove(
"open"
);

}


function createProject(){

const name =
$("projectInput")
.value
.trim();


if(
!name
)
return;


const p = {

id:
"p_" + uid(),

name

};


projects.unshift(
p
);


saveProjects();


projectId =
p.id;


closeProject();

newChat();

renderAll();

}


function selectProject(id){

projectId =
id;


const list =
chats.filter(
c =>
id === "all" ||
c.projectId === id
);


if(
list.length
){

chatId =
list[0].id;

async function fileData(file){

const raw =
await new Promise(
(res,rej)=>{

const r =
new FileReader();


r.onload =
()=>res(
r.result
);


r.onerror =
rej;


r.readAsDataURL(
file
);

}
);


return await new Promise(
resolve=>{

const im =
new Image();


im.onload =
()=>{

const scale =
Math.min(
1,
1400 /
Math.max(
im.width,
im.height
)
);


const c =
document.createElement(
"canvas"
);


c.width =
Math.round(
im.width *
scale
);


c.height =
Math.round(
im.height *
scale
);


c
.getContext("2d")
.drawImage(
im,
0,
0,
c.width,
c.height
);


resolve(
c.toDataURL(
"image/jpeg",
.82
)
);

};


im.onerror =
()=>resolve(
raw
);


im.src =
raw;

}
);

}

let combined =
"";

false;


try{

[

){

);

function setupMic(){

const SR =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(
!SR
)
return null;


const r =
new SR();


r.lang =
"es-AR";


r.continuous =
false;


r.interimResults =
true;


let final =
"";


r.onstart =
()=>{

listening =
true;

final =
"";

$("mic")
.classList
.add(
"on"
);

$("mic")
.textContent =
"■";

};


r.onresult =
e=>{

let tmp =
"";


for(
let i =
e.resultIndex;

i <
e.results.length;

i++
){

const t =
e.results[i][0]
.transcript;


if(
e.results[i]
.isFinal
){

final +=
t + " ";

}else{

tmp +=
t;

}

}


$("prompt")
.value =
(
final +
tmp
)
.trim();

};


r.onerror =
e=>{

listening =
false;


$("mic")
.classList
.remove(
"on"
);


$("mic")
.textContent =
"🎙";


if(
e.error ===
"not-allowed"
){

alert(
"Tenés que permitir el micrófono en el navegador."
);

}

};


r.onend =
()=>{

listening =
false;


$("mic")
.classList
.remove(
"on"
);


$("mic")
.textContent =
"🎙";


if(
$("prompt")
.value
.trim()
){

setTimeout(
send,
120
);

}

};


return r;

}
