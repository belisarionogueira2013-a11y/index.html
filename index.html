<!DOCTYPE html>
<html lang="es">

<meta charset="UTF-8">

<meta
    name="viewport"

>

<title>Inda AI</title>

<meta
    name="description"

>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Segoe UI,Arial,sans-serif;
}

:root{
    --bg:#0d0d0d;
    --sidebar:#111111;
    --panel:#171717;
    --panel2:#1c1c1c;
    --hover:#242424;
    --border:#2b2b2b;
    --text:#f5f5f5;
    --muted:#858585;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =====================================================
   AUTH
===================================================== */

.auth-screen{
    width:100%;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#0d0d0d;
}

.auth-card{
    width:min(420px,100%);
    background:#151515;
    border:1px solid #2d2d2d;
    border-radius:18px;
    padding:26px;
}

.auth-logo{
    text-align:center;
    font-size:30px;
    font-weight:700;
    margin-bottom:8px;
}

.auth-subtitle{
    text-align:center;
    color:#888;
    font-size:13px;
    margin-bottom:22px;
}

.auth-tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.auth-tab{
    flex:1;
    height:42px;
    border:1px solid #333;
    border-radius:10px;
    background:#1c1c1c;
    color:#aaa;
}

.auth-tab.active{
    background:#fff;
    color:#111;
}

.auth-form{
    display:none;
}

.auth-form.active{
    display:block;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    margin-bottom:7px;
    color:#aaa;
    font-size:12px;
}

.field input{
    width:100%;
    height:44px;
    border:1px solid #333;
    border-radius:10px;
    background:#0f0f0f;
    color:#fff;
    padding:0 12px;
    outline:none;
}

.field input:focus{
    border-color:#555;
}

.auth-submit{
    width:100%;
    height:44px;
    border:0;
    border-radius:10px;
    background:#fff;
    color:#111;
    font-weight:600;
}

.auth-message{
    min-height:20px;
    margin-top:12px;
    color:#888;
    text-align:center;
    font-size:12px;
}

.hidden{
    display:none !important;
}

/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    height:100dvh;
    display:none;
}

.layout{
    display:flex;
    width:100%;
    height:100%;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    width:270px;
    min-width:270px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    padding:14px;
    display:flex;
    flex-direction:column;
}

.logo{
    height:55px;
    display:flex;
    align-items:center;
    padding:0 10px;
    font-size:21px;
    font-weight:600;
}

.new-chat{
    width:100%;
    height:44px;
    border:1px solid #333;
    border-radius:10px;
    background:#191919;
    color:#fff;
    font-size:14px;
}

.new-chat:hover{
    background:#252525;
}

.plan{
    margin-top:12px;
    padding:11px;
    border:1px solid #292929;
    border-radius:10px;
    background:#171717;
}

.plan-title{
    font-size:12px;
    color:#aaa;
}

.plan-value{
    margin-top:5px;
    font-size:13px;
    font-weight:600;
}

.counter{
    margin-top:5px;
    color:#777;
    font-size:11px;
}

.role-value{
    margin-top:3px;
    color:#777;
    font-size:11px;
}

.sidebar-title{
    margin:24px 9px 9px;
    color:#666;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
}

.history{
    flex:1;
    overflow-y:auto;
}

.chat-item{
    display:flex;
    align-items:center;
    gap:6px;
    padding:10px;
    border-radius:9px;
    margin-bottom:4px;
    color:#ccc;
    font-size:13px;
    cursor:pointer;
}

.chat-item:hover{
    background:var(--hover);
}

.chat-item.active{
    background:#282828;
    color:#fff;
}

.chat-title{
    flex:1;
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.delete-chat{
    color:#777;
    opacity:0;
    cursor:pointer;
}

.chat-item:hover .delete-chat{
    opacity:1;
}

.sidebar-footer{
    margin-top:12px;
    border-top:1px solid #222;
    padding-top:12px;
}

.account-name{
    color:#ccc;

    margin-bottom:8px;
}

.logout-button{

    border:1px solid #333;
    border-radius:9px;
    background:#191919;
    color:#ccc;
}

/* =====================================================
   MAIN
===================================================== */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

header{
    height:60px;
    min-height:60px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.title{
    font-size:15px;
    font-weight:600;
}

.mobile-menu{
    display:none;
}

.header-actions{
    position:absolute;
    right:16px;
    display:flex;
    align-items:center;
    gap:8px;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    color:#777;
    font-size:11px;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#777;
}

.settings-button{
    width:34px;
    height:34px;
    border:1px solid #2d2d2d;
    border-radius:9px;
    background:#181818;
    color:#ccc;
}

/* =====================================================
   CHAT
===================================================== */

.chat{
    flex:1;
    overflow-y:auto;
    padding:30px 20px 150px;
    scroll-behavior:smooth;
}

.chat-inner{
    width:100%;
    max-width:900px;
    margin:auto;
}

.message-row{
    display:flex;
    width:100%;
    margin:18px 0;
}

.message-row.user{
    justify-content:flex-end;
}

.message-row.ai{
    justify-content:flex-start;
}

.avatar{
    width:30px;
    height:30px;
    border-radius:8px;
    background:#242424;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:700;
    margin-right:10px;
    flex-shrink:0;
}

.message{
    max-width:82%;
    padding:13px 16px;
    border-radius:14px;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
    font-size:15px;
}

.message.user{
    background:#292929;
}

.message.ai{
    background:transparent;
    padding-left:0;
}

.thinking{
    opacity:.5;
}

/* =====================================================
   WELCOME
===================================================== */

.welcome{
    min-height:65vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.welcome-logo{
    width:66px;
    height:66px;
    border-radius:18px;
    background:#202020;
    border:1px solid #303030;

    margin-bottom:18px;
}

.welcome h1{

    margin-bottom:10px;
}

.welcome p{
    color:#888;
    font-size:14px;
}

/* =====================================================
   INPUT
===================================================== */

.input-area{
    position:fixed;
    left:270px;
    right:0;
    bottom:0;
    padding:20px;
    padding-bottom:max(
        20px,
        env(safe-area-inset-bottom)
    );
    background:linear-gradient(
        transparent,
        var(--bg) 30%
    );
    z-index:20;
}

.input-box{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    background:#1b1b1b;
    border:1px solid #303030;
    border-radius:17px;
    padding:8px;
}

.input-box:focus-within{
    border-color:#444;
}

#prompt{
    flex:1;
    resize:none;
    min-height:42px;
    max-height:180px;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    padding:11px 12px;
    font-size:15px;
    line-height:1.4;
}

#prompt::placeholder{
    color:#777;
}

.send{
    width:40px;
    height:40px;
    border:0;
    border-radius:11px;
    background:#fff;
    color:#111;
    font-size:19px;
    flex-shrink:0;
}

.send:disabled{
    opacity:.4;
}

.info{
    max-width:900px;
    margin:7px auto 0;
    text-align:center;
    color:#555;
    font-size:10px;
}

/* =====================================================
   SETTINGS
===================================================== */

.settings-overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.55);
    z-index:100;
}

.settings-overlay.open{
    display:flex;
}

.settings-panel{
    width:min(430px,100%);
    background:#151515;
    border:1px solid #303030;
    border-radius:16px;
    padding:20px;
}

.settings-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.settings-header h2{
    font-size:18px;
}

.close-settings{
    width:32px;
    height:32px;
    border:0;
    border-radius:8px;
    background:#222;
    color:#bbb;
    font-size:18px;
}

.setting{
    margin-bottom:18px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aaa;
    font-size:13px;
}

.setting select{
    width:100%;
    height:42px;
    border:1px solid #333;
    border-radius:10px;
    background:#1d1d1d;
    color:#fff;
    padding:0 10px;
}

.setting-box{
    border:1px solid #2b2b2b;
    border-radius:10px;
    padding:12px;
    background:#1b1b1b;
}

.setting-main{
    font-weight:600;
    font-size:13px;
}

.setting-description{
    margin-top:5px;
    color:#777;
    font-size:11px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .sidebar{
        display:none;
    }

    .main{
        width:100%;
    }

    header{
        height:50px;
        min-height:50px;
        justify-content:flex-start;
        padding-left:52px;
    }

    .mobile-menu{
        display:flex;

        height:32px;
        border:0;
        background:transparent;
        color:#ddd;
        font-size:20px;
    }

    .title{
        font-size:15px;
    }

    .status{
        display:none;
    }

    .header-actions{
        right:10px;
    }

    .chat{
        padding:18px 13px 125px;
    }

    .message-row{
        margin:14px 0;

    .message-row.ai{

    }

    .message{

    .avatar{

    }

    .welcome{
        min-height:calc(100dvh - 180px);

    }

    .welcome h1{
        font-size:27px;
    }

    .input-area{
        left:0;
        right:0;
        padding:
            8px
            10px

    .input-box{

    #prompt{

    .send{

    }

    .settings-overlay{
        align-items:flex-end;
        padding:0;
    }

    .settings-panel{
        width:100%;
        border-radius:18px 18px 0 0;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     LOGIN / REGISTRO
===================================================== -->

<div
    id="authScreen"
    class="auth-screen"
>

    <div class="auth-card">

        <div class="auth-logo">
            Inda AI
        </div>

        <div class="auth-subtitle">
            Iniciá sesión o creá tu cuenta
        </div>


        <div class="auth-tabs">

            <button
                id="loginTab"
                class="auth-tab active"
                onclick="mostrarFormulario('login')">
                Iniciar sesión
            </button>

            <button
                id="registerTab"
                class="auth-tab"
                onclick="mostrarFormulario('register')">
                Crear cuenta
            </button>

        </div>


        <!-- LOGIN -->

        <form
            id="loginForm"
            class="auth-form active"
            onsubmit="iniciarSesion(event)"
        >

            <div class="field">

                <label>
                    Usuario
                </label>

                <input
                    id="loginUser"
                    type="text"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Contraseña
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                class="auth-submit"
                type="submit"
            >
                Entrar
            </button>

        </form>


        <!-- REGISTRO -->

        <form
            id="registerForm"
            class="auth-form"
            onsubmit="crearCuenta(event)"
        >

            <div class="field">

                <label>
                    Nombre de usuario
                </label>

                <input
                    id="registerUser"
                    type="text"
                    minlength="3"
                    maxlength="30"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Contraseña
                </label>

                <input
                    id="registerPassword"
                    type="password"
                    minlength="6"
                    required
                >

            </div>


            <button
                class="auth-submit"
                type="submit"
            >
                Crear cuenta
            </button>

        </form>


        <div
            id="authMessage"
            class="auth-message"
        ></div>

    </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div
    id="app"
    class="app"
>

<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            Inda AI
        </div>


        <button
            class="new-chat"
            onclick="nuevoChat()"
        >
            + Nuevo chat
        </button>


        <div class="plan">

            <div class="plan-title">
                Plan
            </div>

            <div
                id="planValue"
                class="plan-value"
            >
                Normal
            </div>

            <div
                id="counter"
                class="counter"
            >
                50 preguntas disponibles
            </div>

            <div
                id="roleValue"
                class="role-value"
            >
                Usuario
            </div>

        </div>


        <div class="sidebar-title">
            Conversaciones
        </div>


        <div
            id="history"
            class="history"
        ></div>


        <div class="sidebar-footer">

            <div
                id="sidebarUser"
                class="account-name"
            >
                Usuario
            </div>

            <button
                class="logout-button"
                onclick="cerrarSesion()"
            >
                Cerrar sesión
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header>

            <button
                class="mobile-menu"
                onclick="mostrarMenuMovil()"
                aria-label="Abrir menú"
            >
                ☰
            </button>


            <div class="title">
                Inda AI
            </div>


            <div class="header-actions">

                <div class="status">

                    <div
                        id="dot"
                        class="dot"
                    ></div>

                    <span id="estado">
                        Comprobando...
                    </span>

                </div>


                <button
                    class="settings-button"
                    onclick="abrirConfiguracion()"
                    aria-label="Configuración"

                    ⚙
                </button>

            </div>

        </header>


        <section

            class="chat"
        >

            <div
                id="chatInner"
                class="chat-inner"
            ></div>

        </section>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="prompt"
                    rows="1"
                    placeholder="Preguntale algo a Inda AI..."
                    autocomplete="off"
                    spellcheck="true"
                ></textarea>


                <button
                    id="send"
                    class="send"
                    onclick="enviar()"
                >
                    ↑
                </button>

            </div>


            <div class="info">
                Inda AI puede equivocarse. Revisá la información importante.
            </div>

        </div>

    </main>

</div>

</div>


<!-- =====================================================
     CONFIGURACIÓN
===================================================== -->

<div
    id="settingsOverlay"
    class="settings-overlay"
    onclick="cerrarConfiguracionDesdeFondo(event)"
>

    <div
        class="settings-panel"
        onclick="event.stopPropagation()"
    >

        <div class="settings-header">

            </label>

            <select
                id="languageSelect"
                onchange="cambiarIdioma()"
            >

                <option value="auto">
                    Automático
                </option>

                <option value="es">
                    Español
                </option>

                <option value="en">
                    English
                </option>

                <option value="fr">
                    Français
                </option>

            </select>

        </div>


        <div class="setting">

            <label>
                Plan
            </label>

            <div class="setting-box">

                <div
                    id="settingsPlan"
                    class="setting-main"
                >
                    Normal
                </div>

                <div

                    class="setting-description"

            <label>
                Cuenta
            </label>

                    id="settingsUsername"

                <div
                    id="settingsRole"

                    Usuario
                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const API_URL =
    "https://inda-ai-api2-0.belisarionogueira2013.workers.dev";

const USERS_KEY =
    "inda_users_demo_v2";

const SESSION_KEY =
    "inda_session_demo_v2";

const LIMITE_DIARIO =
    50;


/* =====================================================
   ELEMENTOS
===================================================== */

const authScreen =
    document.getElementById("authScreen");

const app =
    document.getElementById("app");

const authMessage =
    document.getElementById("authMessage");

const history =
    document.getElementById("history");

const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const input =
    document.getElementById("prompt");

const send =
    document.getElementById("send");

const estado =
    document.getElementById("estado");

const dot =
    document.getElementById("dot");

const planValue =
    document.getElementById("planValue");

const counter =
    document.getElementById("counter");

const roleValue =
    document.getElementById("roleValue");

const sidebarUser =
    document.getElementById("sidebarUser");

const settingsOverlay =
    document.getElementById("settingsOverlay");

const languageSelect =
    document.getElementById("languageSelect");

const settingsPlan =
    document.getElementById("settingsPlan");

const settingsPlanDescription =
    document.getElementById(
        "settingsPlanDescription"
    );

const settingsUsername =
    document.getElementById(
        "settingsUsername"
    );

const settingsRole =
    document.getElementById(
        "settingsRole"
    );


/* =====================================================
   CUENTA ACTUAL
===================================================== */

let usuarioActual =
    null;


/* =====================================================
   USUARIOS
===================================================== */

function getUsers(){

    try{

        return JSON.parse(
            localStorage.getItem(
                USERS_KEY
            ) || "{}"
        );

    }catch{

        return {};

    }

}


function saveUsers(users){

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );

}


/* =====================================================
   AUTENTICACIÓN
===================================================== */

function mostrarFormulario(tipo){

    const loginForm =
        document.getElementById(
            "loginForm"
        );

    const registerForm =
        document.getElementById(
            "registerForm"
        );

    const loginTab =
        document.getElementById(
            "loginTab"
        );

    const registerTab =
        document.getElementById(
            "registerTab"
        );


    if(tipo === "login"){

        loginForm.classList.add(
            "active"
        );

        registerForm.classList.remove(
            "active"
        );

        loginTab.classList.add(
            "active"
        );

        registerTab.classList.remove(
            "active"
        );

    }else{

        loginForm.classList.remove(
            "active"
        );

        registerForm.classList.add(
            "active"
        );

        loginTab.classList.remove(
            "active"
        );

        registerTab.classList.add(
            "active"
        );

    }

    authMessage.textContent =
        "";

}


/* =====================================================
   CREAR CUENTA
===================================================== */

function crearCuenta(event){

    event.preventDefault();


    const username =
        document.getElementById(
            "registerUser"
        ).value.trim();


    const password =
        document.getElementById(
            "registerPassword"
        ).value;


    if(
        username.length < 3
    ){

        authMessage.textContent =
            "El usuario debe tener al menos 3 caracteres.";

        return;

    }


    if(
        password.length < 6
    ){

        authMessage.textContent =
            "La contraseña debe tener al menos 6 caracteres.";

        return;

    }


    /*
      No permitimos registrar el nombre reservado.
    */

    if(
        username.toLowerCase()
        ===
        "beligmail"
    ){

        authMessage.textContent =
            "Ese nombre de usuario está reservado.";

        return;

    }


    const users =
        getUsers();


    const key =
        username.toLowerCase();


    if(users[key]){

        authMessage.textContent =
            "Ese usuario ya existe.";

        return;

    }


    users[key] = {

        username:
            username,

        password:
            password,

        plan:
            "Normal",

        role:
            "Usuario",

        premium:
            false,

        chats:
            0,

        createdAt:
            new Date().toISOString()

    };


    saveUsers(
        users
    );


    document.getElementById(
        "registerForm"
    ).reset();


    mostrarFormulario(
        "login"
    );


    authMessage.textContent =
        "Cuenta creada. Ahora iniciá sesión.";

}


/* =====================================================
   INICIAR SESIÓN
===================================================== */

function iniciarSesion(event){

    event.preventDefault();


    const username =
        document.getElementById(
            "loginUser"
        ).value.trim();


    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    /*
      CUENTA CEO + PREMIUM
    */

    if(
        username.toLowerCase()
        ===
        "beligmail"
        &&
        password
        ===
        "Indalecio2017"
    ){

        usuarioActual = {

            username:
                "beligmail",

            password:
                password,

            plan:
                "Premium",

            role:
                "CEO",

            premium:
                true,

            chats:
                0

        };


        localStorage.setItem(
            SESSION_KEY,
            JSON.stringify(
                usuarioActual
            )
        );


        mostrarAplicacion();

        return;

    }


    /*
      CUENTAS NORMALES
    */

    const users =
        getUsers();


    const key =
        username.toLowerCase();


    const user =
        users[key];


    if(
        !user ||
        user.password !== password
    ){

        authMessage.textContent =
            "Usuario o contraseña incorrectos.";

        return;

    }


    usuarioActual = {

        username:
            user.username,

        plan:
            user.plan || "Normal",

        role:
            user.role || "Usuario",

        premium:
            user.premium === true,

        chats:
            user.chats || 0

    };


    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify(
            usuarioActual
        )
    );


    mostrarAplicacion();

}


/* =====================================================
   MOSTRAR APP
===================================================== */

function mostrarAplicacion(){

    authScreen.classList.add(
        "hidden"
    );

    app.style.display =
        "block";


    sidebarUser.textContent =
        usuarioActual.username;


    settingsUsername.textContent =
        usuarioActual.username;


    settingsRole.textContent =
        usuarioActual.role;


    actualizarPlan();


    cargarIdioma();


    cargarChats();


    actualizarEstado();

}


/* =====================================================
   CERRAR SESIÓN
===================================================== */

function cerrarSesion(){

    localStorage.removeItem(
        SESSION_KEY
    );


    usuarioActual =
        null;


    app.style.display =
        "none";


    authScreen.classList.remove(
        "hidden"
    );


    document.getElementById(
        "loginForm"
    ).reset();


    authMessage.textContent =
        "";

}


/* =====================================================
   SESIÓN EXISTENTE
===================================================== */

function restaurarSesion(){

    try{

        const saved =
            localStorage.getItem(
                SESSION_KEY
            );


        if(!saved)
            return;


        const session =
            JSON.parse(
                saved
            );


        if(
            session &&
            session.username
        ){

            usuarioActual =
                session;

            mostrarAplicacion();

        }

    }catch{

        localStorage.removeItem(
            SESSION_KEY
        );

    }

}


/* =====================================================
   PREMIUM
===================================================== */

function activarPremium(){

    if(!usuarioActual)
        return;


    usuarioActual.premium =
        true;

    usuarioActual.plan =
        "Premium";


    if(
        usuarioActual.role
        !==
        "CEO"
    ){

        usuarioActual.role =
            "Usuario";

    }


    guardarSesion();


    actualizarPlan();

}


function comprobarCodigoPremium(texto){

    const codigo =
        String.fromCharCode(
            105,110,100,97,
            98,101,108,105,
            50,50
        );


    return (
        texto
            .trim()
            .toLowerCase()
        ===
        codigo
    );

}


/* =====================================================
   GUARDAR SESIÓN
===================================================== */

function guardarSesion(){

    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify(
            usuarioActual
        )
    );

}


/* =====================================================
   PLAN
===================================================== */

function actualizarPlan(){

    if(
        !usuarioActual
    )
        return;


    if(
        usuarioActual.premium
    ){

        planValue.textContent =
            "Premium";

        counter.textContent =
            "Preguntas ilimitadas";

        settingsPlan.textContent =
            "Premium";

        settingsPlanDescription.textContent =
            "Respuestas más completas y detalladas.";

    }else{

        planValue.textContent =
            "Normal";

        settingsPlan.textContent =
            obtenerRestantes()
            +
            " preguntas disponibles";

        settingsPlanDescription.textContent =
            "Respuestas más simples y cortas.";

    }


    roleValue.textContent =
        usuarioActual.role;


}


/* =====================================================
   CONTADOR
===================================================== */

function fechaHoy(){

    const date =
        new Date();


    return (
        date.getFullYear()
        +
        "-"
        +
        String(
            date.getMonth()+1
        ).padStart(2,"0")
        +
        "-"
        +
        String(
            date.getDate()
        ).padStart(2,"0")
    );

}


function usoKey(){

    return (
        "inda_uso_"
        +
        usuarioActual.username
        +
        "_"
        +
        fechaHoy()
    );

}


function obtenerUso(){

    const value =
        Number(
            localStorage.getItem(
                usoKey()
            )
            ||
            "0"
        );


    return Number.isFinite(
        value
    )
        ? value
        : 0;

}


function obtenerRestantes(){

    return Math.max(
        0,
        LIMITE_DIARIO -
        obtenerUso()
    );

}


function incrementarUso(){

    localStorage.setItem(
        usoKey(),
        String(
            obtenerUso() + 1
        )
    );


    actualizarPlan();

}


function puedePreguntar(){

    if(
        usuarioActual?.premium
    ){

        return true;

    }


    return (
        obtenerUso()
        <
        LIMITE_DIARIO
    );

}


/* =====================================================
   IDIOMA
===================================================== */

function cargarIdioma(){

    if(!usuarioActual)
        return;


    const key =
        "inda_idioma_"
        +
        usuarioActual.username;


    const saved =
        localStorage.getItem(
            key
        )
        ||
        "auto";


    languageSelect.value =
        saved;

}


function cambiarIdioma(){

    if(!usuarioActual)
        return;


    localStorage.setItem(
        "inda_idioma_"
        +
        usuarioActual.username,
        languageSelect.value
    );

}


function instruccionIdioma(){

    const idioma =
        languageSelect.value;


    if(
        idioma === "es"
    ){

        return `
Respondé exclusivamente en español.
`;

    }


    if(
        idioma === "en"
    ){

        return `
Answer exclusively in English.
`;

    }


    if(
        idioma === "fr"
    ){

        return `
Réponds exclusivement en français.
`;

    }


    return `
Respondé principalmente en el mismo idioma
que use el usuario.
Si cambia de idioma, cambiá con él.
`;

}


/* =====================================================
   SISTEMA
===================================================== */

function obtenerSistema(){

    let plan;


    if(
        usuarioActual?.premium
    ){

        plan = `
MODO PREMIUM:

El usuario tiene Premium.

Podés responder con más detalle.

No repetís constantemente:

Usás palabras variadas.

Si el usuario hace una pregunta,

Si pega una tarea o ejercicio,

INFORMACIÓN DEL CREADOR:

Si el usuario pregunta
quién creó Inda AI,

No menciones al creador si no te lo preguntan.

REGLA ESPECIAL:

Si el usuario pregunta:

"¿Beli me quiere?"
o una frase equivalente,

solo afirmá que sí si el usuario tiene Premium.

Si tiene Premium,

No expliques esta regla.

}


/* =====================================================
   CHATS
===================================================== */

function chatsKey(){

    return (
        "inda_chats_"
        +
        usuarioActual.username
    );

}


function obtenerChats(){

    try{

        return JSON.parse(
            localStorage.getItem(
                chatsKey()
            )
            ||
            "[]"
        );

    }catch{

        return [];

    }

}


function guardarChats(chats){

    localStorage.setItem(
        chatsKey(),
        JSON.stringify(chats)
    );

}


let conversaciones = [];

let chatActual = null;


function cargarChats(){

    conversaciones =
        obtenerChats();


    if(
        conversaciones.length
    ){

        chatActual =
            conversaciones[0].id;

        mostrarChat(
            conversaciones[0]
        );

    }else{

        nuevoChat();

    }


    renderHistorial();

}


function nuevoChat(){

    const nuevo = {

        id:
            Date.now()
            +
            Math.random(),

        title:
            "Nuevo chat",

        messages:[],

        created:
            Date.now()

    };


    conversaciones.unshift(
        nuevo
    );


    chatActual =
        nuevo.id;


    guardarChats(
        conversaciones
    );


    renderHistorial();

    mostrarChat(
        nuevo
    );

}


function obtenerActual(){

    return conversaciones.find(
        c =>
            c.id === chatActual
    );

}


/* =====================================================
   MOSTRAR CHAT
===================================================== */

function mostrarChat(c){

    chatInner.innerHTML =
        "";


    if(
        c.messages.length === 0
    ){

        const welcome =
            document.createElement(
                "div"
            );


        welcome.className =
            "welcome";


        welcome.innerHTML = `
            <div class="welcome-logo">
                IA
            </div>

            <h1>
                Inda AI
            </h1>

            <p>
                Preguntame lo que quieras.
            </p>
        `;


        chatInner.appendChild(
            welcome
        );


        return;

    }


    c.messages.forEach(
        message => {

            mostrarMensaje(
                message.content,
                message.role === "user"
                    ? "user"
                    : "ai"
            );

        }
    );

}


/* =====================================================
   MENSAJES
===================================================== */

function mostrarMensaje(
    texto,
    quien
){

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row "
        +
        quien;


    if(
        quien === "ai"
    ){

        const avatar =
            document.createElement(
                "div"
            );


        avatar.className =
            "avatar";


        avatar.textContent =
            "IA";


        row.appendChild(
            avatar
        );

    }


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "message "
        +
        quien;


    bubble.textContent =
        texto;


    row.appendChild(
        bubble
    );


    chatInner.appendChild(
        row
    );


    requestAnimationFrame(
        () => {

            chat.scrollTop =
                chat.scrollHeight;

        }
    );


    return bubble;

}


/* =====================================================
   HISTORIAL
===================================================== */

function renderHistorial(){

    history.innerHTML =
        "";


    conversaciones.forEach(
        conversation => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "chat-item"
                +
                (
                    conversation.id ===
                    chatActual
                        ? " active"
                        : ""
                );


            const title =
                document.createElement(
                    "span"
                );


            title.className =
                "chat-title";


            title.textContent =
                conversation.title;


            const borrar =
                document.createElement(
                    "span"
                );


            borrar.className =
                "delete-chat";


            borrar.textContent =
                "×";


            borrar.onclick =
                function(event){

                    event.stopPropagation();

                    borrarChat(
                        conversation.id
                    );

                };


            item.appendChild(
                title
            );


            item.appendChild(
                borrar
            );


            item.onclick =
                function(){

                    abrirChat(
                        conversation.id
                    );

                };


            history.appendChild(
                item
            );

        }
    );

}


function abrirChat(id){

    const c =
        conversaciones.find(
            x =>
                x.id === id
        );


    if(!c)
        return;


    chatActual =
        id;


    mostrarChat(
        c
    );


    renderHistorial();


    input.focus();

}


function borrarChat(id){

    conversaciones =
        conversaciones.filter(
            c =>
                c.id !== id
        );


    if(
        chatActual === id
    ){

        if(
            conversaciones.length
        ){

            chatActual =
                conversaciones[0].id;


            mostrarChat(
                conversaciones[0]
            );

        }else{

            nuevoChat();

        }

    }


    guardarChats(
        conversaciones
    );


    renderHistorial();

}


/* =====================================================
   ENVIAR
===================================================== */

async function enviar(){

    const texto =
        input.value.trim();


    if(!texto)
        return;


    /* ACTIVAR PREMIUM */

    if(
        comprobarCodigoPremium(
            texto
        )
    ){

        activarPremium();


        input.value =
            "";


        ajustarInput();


        mostrarMensaje(
            "Premium activado.",
            "ai"
        );


        return;

    }


    /* REGLA BELI */

    const normalizada =
        texto
            .toLowerCase()
            .normalize("NFD")
            .replace(
                /[\u0300-\u036f]/g,
                ""
            );


    if(
        normalizada.includes(
            "beli me ama"
        )
        ||
        normalizada.includes(
            "beli me quiere"
        )
    ){

        if(
            usuarioActual?.premium
        ){

            mostrarMensaje(
                "Sí. Porque le doy el Premium a la gente que amo.",
                "ai"
            );

        }else{

            mostrarMensaje(
                "No tengo información para afirmar eso.",
                "ai"
            );

        }


        input.value =
            "";


        ajustarInput();


        return;

    }


    /* LÍMITE */

    if(
        !puedePreguntar()
    ){

        mostrarMensaje(
`Llegaste al límite de 50 preguntas de hoy.

El contador se reinicia automáticamente mañana.`,
            "ai"
        );


        return;

    }


    if(!chatActual)
        nuevoChat();


    const conversation =
        obtenerActual();


    if(!conversation)
        return;


    send.disabled =
        true;


    conversation.messages.push({

        role:"user",

        content:texto

    });


    if(
        conversation.title ===
        "Nuevo chat"
    ){

        conversation.title =
            texto.length > 45
                ? texto.substring(
                    0,
                    45
                  )
                  +
                  "..."
                : texto;

    }


    guardarChats(
        conversaciones
    );


    renderHistorial();


    mostrarMensaje(
        texto,
        "user"
    );


    input.value =
        "";


    ajustarInput();


    const thinking =
        mostrarMensaje(
            "Pensando...",
            "ai"
        );


    thinking.classList.add(
        "thinking"
    );


    try{

        const response =
            await fetch(
                API_URL +
                "/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            system:
                                obtenerSistema(),

                            messages:
                                conversation.messages

                        })
                }
            );


        const data =
            await response.json();


        if(
            !response.ok
        ){

            throw new Error(
                data?.error ||
                "Error del servidor."
            );

        }


        const answer =
            data?.response;


        if(!answer){

            throw new Error(
                "La IA no devolvió una respuesta."
            );

        }


        thinking.classList.remove(
            "thinking"
        );


        thinking.textContent =
            answer;


        conversation.messages.push({

            role:"assistant",

            content:answer

        });


        incrementarUso();


        guardarChats(
            conversaciones
        );


    }catch(error){

        thinking.classList.remove(
            "thinking"
        );


        thinking.textContent =
`No pude conectarme con Inda AI.

${error.message}`;

        console.error(
            error
        );

    }


    send.disabled =
        false;


    input.focus();

}


/* =====================================================
   TEXTAREA
===================================================== */

function ajustarInput(){

    input.style.height =
        "auto";


    input.style.height =
        Math.min(
            input.scrollHeight,
            window.innerWidth <= 700
                ? 120
                : 180
        )
        +
        "px";

}


input.addEventListener(
    "input",
    ajustarInput
);


input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
            &&
            !event.shiftKey
        ){

            event.preventDefault();

            enviar();

        }

    }
);

   CONFIGURACIÓN
===================================================== */

    settingsOverlay.classList.add(

    );

}


function cerrarConfiguracion(){

}

){

/* =====================================================
   MENÚ MÓVIL
===================================================== */

function mostrarMenuMovil(){

    if(
        window.innerWidth > 700
    )
        return;


    if(
        !conversaciones.length
    ){

        alert(
            "No hay conversaciones."
        );

        return;

    }


    const lista =
        conversaciones
            .map(
                (c,index) =>
                    (index + 1)
                    +
                    ". "
                    +
                    c.title
            )
            .join("\n");


    const selection =
        prompt(
            "Conversaciones\n\n" +
            lista +
            "\n\nEscribí el número:"
        );


    if(!selection)
        return;


    const index =
        Number(
            selection
        ) - 1;


    if(
        Number.isInteger(index)
        &&
        index >= 0
        &&
        index < conversaciones.length
    ){

        abrirChat(
            conversaciones[index].id
        );

    }

}
