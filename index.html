```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inda AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Segoe UI,Arial,sans-serif;
}

body{
  background:#0d0d0d;
  color:#f5f5f5;
  min-height:100vh;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:min(420px,100%);
  background:#171717;
  border:1px solid #2b2b2b;
  border-radius:18px;
  padding:26px;
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:700;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#888;
  font-size:13px;
  margin-bottom:24px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.tabs button{
  flex:1;
  height:40px;
  border:1px solid #303030;
  border-radius:10px;
  background:#1d1d1d;
  color:#aaa;
}

.tabs button.active{
  background:#fff;
  color:#111;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  color:#aaa;
  font-size:12px;
  margin-bottom:7px;
}

.field input{
  width:100%;
  height:44px;
  border-radius:10px;
  border:1px solid #333;
  outline:none;
  background:#101010;
  color:#fff;
  padding:0 12px;
}

.primary{
  width:100%;
  height:44px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#111;
  font-weight:600;
}

.message{
  margin-top:12px;
  min-height:18px;
  color:#888;
  font-size:12px;
  text-align:center;
}

.hidden{
  display:none !important;
}

.app{
  min-height:100vh;
  display:none;
}

.topbar{
  height:60px;
  border-bottom:1px solid #2b2b2b;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.brand{
  font-weight:700;
}

.user-area{
  display:flex;
  align-items:center;
  gap:10px;
}

.logout{
  border:1px solid #333;
  background:#191919;
  color:#ccc;
  border-radius:9px;
  padding:8px 12px;
}

.content{
  padding:30px;
  max-width:1000px;
  margin:auto;
}

.welcome{
  padding:28px;
  border:1px solid #2b2b2b;
  border-radius:16px;
  background:#151515;
}

.welcome h1{
  margin-bottom:10px;
}

.welcome p{
  color:#888;
  line-height:1.5;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:18px;
}

.stat{
  background:#151515;
  border:1px solid #2b2b2b;
  border-radius:14px;
  padding:18px;
}

.stat-title{
  color:#777;
  font-size:11px;
  margin-bottom:7px;
}

.stat-value{
  font-size:22px;
  font-weight:700;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:1fr;
  }

  .topbar{
    padding:0 12px;
  }

  .content{
    padding:15px;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN / REGISTRO
===================================================== -->

<div id="authScreen" class="screen">

  <div class="card">

    <div class="logo">
      Inda AI
    </div>

    <div class="subtitle">
      Iniciá sesión o creá tu cuenta
    </div>

    <div class="tabs">

      <button
        id="loginTab"
        class="active"
        onclick="mostrarFormulario('login')">
        Iniciar sesión
      </button>

      <button
        id="registerTab"
        onclick="mostrarFormulario('register')">
        Crear cuenta
      </button>

    </div>


    <!-- LOGIN -->

    <form
      id="loginForm"
      class="form active"
      onsubmit="iniciarSesion(event)">

      <div class="field">

        <label>
          Nombre de usuario
        </label>

        <input
          id="loginUser"
          type="text"
          autocomplete="username"
          required>

      </div>


      <div class="field">

        <label>
          Contraseña
        </label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required>

      </div>


      <button
        class="primary"
        type="submit">
        Entrar
      </button>

    </form>


    <!-- REGISTRO -->

    <form
      id="registerForm"
      class="form"
      onsubmit="crearCuenta(event)">

      <div class="field">

        <label>
          Nombre de usuario
        </label>

        <input
          id="registerUser"
          type="text"
          autocomplete="username"
          minlength="3"
          maxlength="30"
          required>

      </div>


      <div class="field">

        <label>
          Contraseña
        </label>

        <input
          id="registerPassword"
          type="password"
          autocomplete="new-password"
          minlength="6"
          required>

      </div>


      <button
        class="primary"
        type="submit">
        Crear cuenta
      </button>

    </form>


    <div
      id="authMessage"
      class="message">
    </div>

  </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div
  id="app"
  class="app">

  <header class="topbar">

    <div class="brand">
      Inda AI
    </div>

    <div class="user-area">

      <span id="currentUser">
        Usuario
      </span>

      <button
        class="logout"
        onclick="cerrarSesion()">
        Salir
      </button>

    </div>

  </header>


  <main class="content">

    <section class="welcome">

      <h1>
        Bienvenido a Inda AI
      </h1>

      <p>
        Tu cuenta ya está iniciada.
        Desde acá podés entrar a la aplicación,
        guardar tu configuración y usar tus propios chats.
      </p>

    </section>


    <section class="stats">

      <div class="stat">

        <div class="stat-title">
          Cuenta
        </div>

        <div
          id="accountName"
          class="stat-value">
          -
        </div>

      </div>


      <div class="stat">

        <div class="stat-title">
          Chats propios
        </div>

        <div
          id="chatCount"
          class="stat-value">
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-title">
          Plan
        </div>

        <div
          id="accountPlan"
          class="stat-value">
          Normal
        </div>

      </div>

    </section>

  </main>

</div>


<script>

/* =====================================================
   CUENTAS DEMO LOCALES
=====================================================

   IMPORTANTE:
   Esto es solamente una demostración.
   NO sirve como sistema de cuentas real para una
   página pública porque los datos están en el navegador.

   Para cuentas reales se necesita un servidor,
   base de datos y autenticación segura.
===================================================== */


const USERS_KEY =
  "inda_users_demo";

const SESSION_KEY =
  "inda_session_demo";


function getUsers(){

  return JSON.parse(
    localStorage.getItem(
      USERS_KEY
    ) || "{}"
  );

}


function saveUsers(users){

  localStorage.setItem(
    USERS_KEY,
    JSON.stringify(users)
  );

}


function mostrarFormulario(tipo){

  const loginForm =
    document.getElementById(
      "loginForm"
    );

  const registerForm =
    document.getElementById(
      "registerForm"
    );

  const loginTab =
    document.getElementById(
      "loginTab"
    );

  const registerTab =
    document.getElementById(
      "registerTab"
    );


  if(tipo === "login"){

    loginForm.classList.add("active");
    registerForm.classList.remove("active");

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

  }else{

    loginForm.classList.remove("active");
    registerForm.classList.add("active");

    loginTab.classList.remove("active");
    registerTab.classList.add("active");

  }


  mostrarMensaje("");

}


function mostrarMensaje(texto){

  document.getElementById(
    "authMessage"
  ).textContent =
    texto;

}


function crearCuenta(event){

  event.preventDefault();


  const username =
    document.getElementById(
      "registerUser"
    ).value.trim();


  const password =
    document.getElementById(
      "registerPassword"
    ).value;


  if(username.length < 3){

    mostrarMensaje(
      "El usuario debe tener al menos 3 caracteres."
    );

    return;
  }


  if(password.length < 6){

    mostrarMensaje(
      "La contraseña debe tener al menos 6 caracteres."
    );

    return;
  }


  const users =
    getUsers();


  const key =
    username.toLowerCase();


  if(users[key]){

    mostrarMensaje(
      "Ese usuario ya existe."
    );

    return;
  }


  users[key] = {
    username: username,

    password: password,

    plan: "Normal",

    chats: 0,

    createdAt:
      new Date().toISOString()
  };


  saveUsers(users);


  mostrarMensaje(
    "Cuenta creada. Ahora podés iniciar sesión."
  );


  document.getElementById(
    "registerForm"
  ).reset();


  mostrarFormulario(
    "login"
  );

}


function iniciarSesion(event){

  event.preventDefault();


  const username =
    document.getElementById(
      "loginUser"
    ).value.trim();


  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  const users =
    getUsers();


  const key =
    username.toLowerCase();


  const user =
    users[key];


  if(
    !user ||
    user.password !== password
  ){

    mostrarMensaje(
      "Usuario o contraseña incorrectos."
    );

    return;
  }


  localStorage.setItem(
    SESSION_KEY,
    key
  );


  mostrarApp(
    user
  );

}


function mostrarApp(user){

  document.getElementById(
    "authScreen"
  ).classList.add(
    "hidden"
  );


  const app =
    document.getElementById(
      "app"
    );


  app.style.display =
    "block";


  document.getElementById(
    "currentUser"
  ).textContent =
    user.username;


  document.getElementById(
    "accountName"
  ).textContent =
    user.username;


  document.getElementById(
    "chatCount"
  ).textContent =
    String(
      user.chats || 0
    );


  document.getElementById(
    "accountPlan"
  ).textContent =
    user.plan || "Normal";

}


function cerrarSesion(){

  localStorage.removeItem(
    SESSION_KEY
  );


  document.getElementById(
    "app"
  ).style.display =
    "none";


  document.getElementById(
    "authScreen"
  ).classList.remove(
    "hidden"
  );

  document.getElementById(
    "loginForm"
  ).reset();

}


function restaurarSesion(){

  const session =
    localStorage.getItem(
      SESSION_KEY
    );


  if(!session)
    return;


  const users =
    getUsers();


  const user =
    users[session];


  if(!user){

    localStorage.removeItem(
      SESSION_KEY
    );

    return;
  }


  mostrarApp(
    user
  );

}


restaurarSesion();

</script>

</body>
</html>
```
